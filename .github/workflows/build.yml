name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-codebank
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/codebank:latest
            ghcr.io/${{ github.repository_owner }}/codebank:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Deploy to hestia (home server, behind NAT) via an ephemeral Tailscale
      # node + a forced-command SSH deploy key (can only `docker compose pull
      # && up -d` the codebank service — no shell).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy on hestia
        run: |
          install -m700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HESTIA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            kunal@${{ secrets.HESTIA_HOST }} codebank

      - name: Wait for health check with SHA match
        env:
          HEALTH_URL: https://codebank.mirellolabs.com/healthz
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 45); do
            body=$(curl -sf "${HEALTH_URL}" || echo '')
            sha=$(echo "$body" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              echo "health ok (sha=$sha)"; exit 0
            fi
            echo "attempt $i: sha=${sha:-none} (want $EXPECTED_SHA) — retrying"
            sleep 4
          done
          echo "health check timed out"; exit 1
